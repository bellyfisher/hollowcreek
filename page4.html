<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Hollow Creek Farm</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="page4.css" />

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">

                <img
                    src="logo-monogram-hc-wheat.png"
                    width="55"
                    height="55"
                    class="d-inline-block align-text-top"
                    alt="Hollow Creek Farm Logo"
                />

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="page2.html">About Us</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="page3.html">Shop</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <b><u>Contact Us</u></b>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="page5.html">
                                Events
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <main>

        <div class="title">
            <h1>
                <b>
                    Interested in helping out, volunteering,
                    or have any questions?
                    <br>
                    Contact Us!
                </b>
            </h1>
        </div>

        <div class="container">

            <div class="row align-items-center">

                <!-- Contact Form -->
                <div class="col-md-6">

                    <form>

                        <div class="mb-3">
                            <label for="exampleFirstName" class="form-label">
                                First Name
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="exampleFirstName">
                        </div>

                        <div class="mb-3">
                            <label for="exampleLastName" class="form-label">
                                Last Name
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="exampleLastName">
                        </div>

                        <div class="mb-3">
                            <label for="exampleEmail" class="form-label">
                                Email Address
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="exampleEmail">
                        </div>

                        <div class="mb-3">
                            <label for="exampleQuestion" class="form-label">
                                Your Question...
                            </label>
                            <textarea
                                class="form-control"
                                id="exampleQuestion"
                                rows="5"></textarea>
                        </div>

<button type="submit" class="btn farm-btn">
    Submit
</button>

                    </form>

                </div>

                <!-- Image -->
                <div class="col-md-6 text-center">

                    <img
                        src="kids.png"
                        class="img-fluid"
                        alt="Children helping at Hollow Creek Farm">

                </div>

            </div>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
